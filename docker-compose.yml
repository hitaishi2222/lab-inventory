version: "3.9"

services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/data/lab.db
      - BETTER_AUTH_URL=https://labs.hitaishiv.com
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    restart: unless-stopped

  backup:
    image: alpine:latest
    volumes:
      - ./data:/data
      - ./backups:/backups
    command: >
      sh -c "apk add --no-cache sqlite &&
             echo '0 2 * * * sqlite3 /data/lab.db \".backup /backups/backup_$$(date +\%Y\%m\%d_\%H\%M\%S).db\"' | crontab - && cron -f"
    restart: unless-stopped
