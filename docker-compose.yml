services:
  app:
    build: .
    # One image, one port: the container serves the React build and the API on
    # 3000, and runs the SQLite backups in-process (src/server/lib/backup.ts).
    # Nothing else needs to exist — no backup sidecar, no second image.
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/data/lab.db
      # --- Two-lab mode (optional) ---
      # Uncomment the 4 lines below to run two fully separate labs in this
      # one instance. Each lab gets its own database file; a lab selector
      # appears at the bottom of the login page. Leave commented for the
      # default single-lab setup (selector stays hidden).
      # - LAB2_DATABASE_URL=file:/app/data/lab2.db
      # - LAB1_NAME=${LAB1_NAME:-Lab 1}
      # - LAB2_NAME=${LAB2_NAME:-Lab 2}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://labs.example.com}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - TRUSTED_ORIGINS=${TRUSTED_ORIGINS:-}
      # --- Backups (in-process, per lab) ---
      # - BACKUP_ENABLED=1
      # - BACKUP_DIR=/app/backups
      # - BACKUP_INTERVAL_HOURS=24
      # - BACKUP_KEEP=14
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    # The container runs as the unprivileged `node` user (uid 1000) so a bug in
    # the app cannot rewrite the image. If your host user is not uid 1000, give
    # the mounted directories that ownership, or pin the container user:
    #   user: "${UID:-1000}:${GID:-1000}"
    #   sudo chown -R 1000:1000 ./data ./backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
